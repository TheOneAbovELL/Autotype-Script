# Tool configuration only. Runtime dependencies live in requirements.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["autotype.py", "typer.py", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*", "conftest", "test_autotype"]
disallow_untyped_defs = false
